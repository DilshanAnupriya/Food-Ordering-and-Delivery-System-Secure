spring.application.name=payment
# Loads gitignored local dev overrides (STRIPE_SECRET_KEY etc.) when present; no-op otherwise.
spring.config.import=optional:application-local.properties
stripe.secretKey=${STRIPE_SECRET_KEY}

server.port=0
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root


spring.datasource.password=${DB_PASSWORD:12345678}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web=INFO
logging.level.com.OrderManagement=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/