spring.application.name=auth
# Loads gitignored local dev overrides (JWT_SECRET etc.) when present; no-op otherwise.
spring.config.import=optional:application-local.properties
server.port=0

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:12345678}
spring.data.jdbc.dialect=mysql
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Fix (V-AuthWeakness Test 3 - weak/hard-coded signing key): the JWT signing
# secret is now injected from the JWT_SECRET environment variable (a 256-bit
# random value supplied at runtime), instead of a hard-coded value committed to
# source control.
application.jwt.secretKey=${JWT_SECRET}
application.jwt.tokenPrefix=Bearer 
application.jwt.tokenExpirationAfterDays=2

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

spring.mvc.async.request-timeout=600000
spring.servlet.multipart.enabled=true

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Auth_Service sits behind the api_gateway (stable address http://localhost:8082);
# honour X-Forwarded-* headers so Spring Security builds correct absolute URLs.
server.forward-headers-strategy=framework

# --- Google OAuth2 / OpenID Connect login ---
# Register a real OAuth client in Google Cloud Console (APIs & Services > Credentials)
# with authorized redirect URI http://localhost:8082/login/oauth2/code/google, then
# supply GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET via env or application-local.properties.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8082/login/oauth2/code/google

# Frontend page that receives the issued JWT after a successful Google login.
application.oauth2.frontendRedirectUri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
# Frontend login page a failed/cancelled Google login returns to (with ?oauthError=<code>).
application.oauth2.frontendLoginUri=${OAUTH2_FRONTEND_LOGIN_URI:http://localhost:5173/login}
