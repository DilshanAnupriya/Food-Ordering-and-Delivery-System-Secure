# FIX: keep sent-event receipts across restarts; the original service had no delivery ledger.
# Use a persistent shared database via NOTIFICATION_DB_URL when deploying multiple instances.
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:h2:file:./data/notification-delivery;DB_CLOSE_ON_EXIT=FALSE}
