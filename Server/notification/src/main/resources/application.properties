# FIX: per-instance fixed-window quotas, shared by all notification routes.
notification.protection.caller-limit=5
notification.protection.recipient-limit=5
notification.protection.global-limit=100
notification.protection.max-tracked-keys=10000
notification.protection.window=60s
# FIX: bound SMTP blocking time as well as request frequency.
