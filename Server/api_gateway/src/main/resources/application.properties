spring.application.name=api_gateway
# Loads gitignored local dev overrides (JWT_SECRET etc.) when present; no-op otherwise.
spring.config.import=optional:application-local.properties
server.port=8082

## eureka netflix server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT Configuration
# Fix (V-AuthWeakness Test 1 & 3): the gateway now validates JWTs on every
# routed request (see JwtAuthenticationGlobalFilter). The signing secret is the
# same 256-bit value used by the Auth service, injected from the JWT_SECRET
# environment variable - never hard-coded/committed.
application.jwt.secretKey=${JWT_SECRET}


## Login
logging.level.root= INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator = INFO
# Fix V3: TRACE wrote Authorization headers (bearer tokens) to disk. Reduced to INFO.
logging.level.org.springframework.cloud.gateway = INFO


## Restaurant management routes
spring.cloud.gateway.routes[0].id=restaurant
spring.cloud.gateway.routes[0].uri=lb://restaurant
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/restaurants/**

